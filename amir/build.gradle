plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.amir.hesab'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.amir.hesab'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    signingConfigs {
        shop {
            storeFile file('../app/anbar.keystore')
            storePassword 'anbar123'
            keyAlias 'anbar'
            keyPassword 'anbar123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.shop }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shop
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
}
