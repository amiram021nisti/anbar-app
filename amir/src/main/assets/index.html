<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حسابداری امیر</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f0e8;--card:#fffdf8;--ink:#1d2320;--mut:#6c736e;--line:#e3ddd0;--pri:#1d6b58;--pri2:#e1efe9;--red:#bb3a2c;--red2:#f9e4e0;--amb:#a86d14;--amb2:#fbefd9;--sh:0 1px 2px rgba(0,0,0,.05),0 4px 14px rgba(0,0,0,.04)}
@media (prefers-color-scheme:dark){:root{--bg:#121514;--card:#1b1f1d;--ink:#eaeeeb;--mut:#97a19b;--line:#2b312e;--pri:#53b898;--pri2:#1c3830;--red:#ee7466;--red2:#3a2320;--amb:#e3ab52;--amb2:#382d1b;--sh:none}}
[hidden]{display:none!important}
.whbar{max-width:720px;margin:0 auto;padding:0 14px 10px}
#whSeg button{font-size:14.5px}
#whSeg button.on{background:var(--pri);color:#fff}
body.farsude #whSeg button.on{background:#6b4fa0;color:#fff}
body.farsude header h1{color:#6b4fa0}
@media (prefers-color-scheme:dark){body.farsude #whSeg button.on{background:#a58ad8;color:#14121a}body.farsude header h1{color:#b9a2e6}}
/* بارکد، خواندن اسم با دوربین و نیکوتین حذف شده‌اند */
#quickSell,#quickIn,.scan,#nicFilt,.nics,.nic{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;font-size:15px}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(14px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:10px}
h1{font-size:21px;margin:0;font-weight:800;letter-spacing:-.3px}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--mut);margin-top:2px}
.pill{font-size:11.5px;padding:5px 10px;border-radius:99px;background:var(--pri2);color:var(--pri);white-space:nowrap}
.pill.warn{background:var(--amb2);color:var(--amb)}
.pill.bad{background:var(--red2);color:var(--red)}
main{max-width:720px;margin:0 auto;padding:0 14px}
#plist{padding-bottom:150px}
section{display:none}section.on{display:block}
.search{display:flex;gap:8px;margin:4px 0 10px}
.inp{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;outline:none}
.inp:focus{border-color:var(--pri)}
.chip{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 13px;font-size:13px;white-space:nowrap;cursor:pointer}
.chip.on{background:var(--red2);border-color:transparent;color:var(--red)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.prod{display:flex;justify-content:space-between;align-items:center;padding:13px 14px;margin-bottom:8px;cursor:pointer;gap:10px}
.prod .nm{font-weight:700;font-size:15.5px}
.prod .meta{font-size:12.5px;color:var(--mut);margin-top:3px}
.prod .pr{font-size:12.5px;color:var(--mut);margin-top:5px}
.prod .pr b{color:var(--ink);font-weight:600}
.qty{text-align:center;min-width:64px;padding:7px 8px;border-radius:12px;background:var(--pri2);color:var(--pri)}
.qty b{display:block;font-size:19px;font-weight:800;line-height:1.1}
.qty span{font-size:11px}
.qty.low{background:var(--red2);color:var(--red)}
.empty{text-align:center;color:var(--mut);padding:44px 18px;line-height:1.9}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.fab2{position:fixed;left:18px;bottom:calc(160px + env(safe-area-inset-bottom));height:56px;padding:0 18px 0 16px;border-radius:18px;border:0;background:var(--amb);color:#fff;font-size:16px;font-weight:800;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:6;display:flex;align-items:center;gap:8px}
.fab2 svg{width:24px;height:24px}
.fab{position:fixed;left:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:18px;border:0;background:var(--pri);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer;z-index:6}
nav{position:fixed;bottom:0;right:0;left:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;border-radius:12px}
nav button svg{width:23px;height:23px}
nav button.on{color:var(--pri);font-weight:700}
.lbl{font-size:13px;color:var(--mut);margin:12px 2px 6px;display:block}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;border:0;background:none;border-radius:10px;padding:10px;cursor:pointer;font-weight:600;color:var(--mut)}
.seg button.on.out{background:var(--amb2);color:var(--amb)}
.seg button.on.in{background:var(--pri2);color:var(--pri)}
.row{display:flex;gap:10px}.row>*{flex:1;min-width:0}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:46px;height:46px;flex:none;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:22px;cursor:pointer}
.stepper .inp{text-align:center;font-weight:700;font-size:17px}
.sugg{margin-top:6px;overflow:hidden}
.sugg div{padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;justify-content:space-between;gap:8px}
.sugg div:last-child{border:0}
.sugg small{color:var(--mut)}
.picked{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;gap:8px}
.picked b{font-size:16px}
.picked small{display:block;color:var(--mut);margin-top:2px}
.x{border:0;background:var(--bg);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:16px;color:var(--mut);flex:none}
.big{width:100%;border:0;border-radius:14px;padding:15px;font-weight:800;font-size:16px;background:var(--pri);color:#fff;cursor:pointer;margin-top:14px}
.big.out{background:var(--amb)}
.big:disabled{opacity:.45}
.total{display:flex;justify-content:space-between;margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--card);border:1px dashed var(--line);font-size:14px}
.total b{font-size:17px}
h2{font-size:15px;margin:24px 2px 8px;font-weight:700}
.day{font-size:12.5px;color:var(--mut);margin:14px 4px 6px;font-weight:600}
.mv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.mv:last-child{border:0}
.mv .tag{font-size:11px;padding:3px 8px;border-radius:8px;flex:none}
.tag.out{background:var(--amb2);color:var(--amb)}.tag.in{background:var(--pri2);color:var(--pri)}.tag.adj{background:var(--bg);color:var(--mut)}
.mv .info{flex:1;min-width:0}
.mv .info b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:right}
.mv .info small{color:var(--mut);font-size:12px}
.mv .amt{text-align:left;font-size:13px;white-space:nowrap}
.mv .amt small{display:block;color:var(--pri);font-size:11.5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:6px}
.stat{padding:13px 14px}
.stat small{color:var(--mut);font-size:12px;display:block}
.stat b{font-size:19px;font-weight:800;display:block;margin-top:4px}
.stat.hi{background:var(--pri);border-color:var(--pri);color:#fff}
.rt{width:100%;border-collapse:collapse;font-size:13px}
.rt th,.rt td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:right}
.rt th{color:var(--mut);font-weight:600;font-size:12px;background:var(--bg)}
.rt tr:last-child td{border:0}
.rt td.n{white-space:nowrap}
.rt tr.cur td{background:var(--pri2)}
.stat.zero{border-color:var(--red)}
.stat.zero b{color:var(--red)}
.stat.hi small{color:rgba(255,255,255,.8)}
.stat .u{font-size:11px;font-weight:500;opacity:.7}
.btn2{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:600;width:100%;margin-top:8px}
.note{font-size:12px;color:var(--mut);line-height:1.8;margin:14px 4px}
/* sheet */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:var(--bg);width:100%;max-width:720px;border-radius:22px 22px 0 0;padding:8px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:4px 2px 4px;font-size:18px}
.sheet .acts{display:flex;gap:8px;margin-top:16px}
.sheet .acts button{flex:1;margin:0}
.danger{color:var(--red)!important}
.nic{display:inline-block;direction:ltr;font-size:11.5px;font-weight:700;padding:1px 7px;border-radius:7px;background:var(--amb2);color:var(--amb);margin-inline-start:6px;vertical-align:2px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button.on{background:var(--pri2);border-color:transparent;color:var(--pri);font-weight:700}
#cpBody .mv .info b{white-space:normal;direction:rtl;text-align:right}
.cbal{font-size:22px;font-weight:900;margin:6px 0}
.cact{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.cact button{border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 4px;font-size:12.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.cact button i{font-style:normal;font-size:20px}
.dep{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:12px;background:var(--amb2);margin-bottom:6px}
.dep .tx{flex:1;min-width:0}.dep small{display:block;color:var(--mut);font-size:12px}
.dep button{border:0;background:var(--pri);color:#fff;border-radius:10px;padding:9px 10px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none}
.wrow{display:flex;align-items:center;gap:10px;padding:12px 14px;margin-bottom:8px}
.wrow .info{flex:1;min-width:0}
.wrow .info b{display:block}
.wrow .info small{color:var(--mut);font-size:12px}
.wq{display:flex;align-items:center;gap:6px}
.wq button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;cursor:pointer}
.wq b{min-width:36px;text-align:center;font-size:19px;font-weight:800;color:var(--amb)}
.wret{border:0;background:var(--pri2);color:var(--pri);border-radius:10px;padding:8px 10px;font-size:12.5px;font-weight:700;cursor:pointer;margin-top:6px}
.tag.war{background:var(--amb2);color:var(--amb)}.tag.ret{background:var(--pri2);color:var(--pri)}
.brow{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:8px}
.brow.ok{border-color:var(--pri)}
.brow.unsure{border-color:var(--amb);background:var(--amb2)}
.brow.none{border-color:var(--red);background:var(--red2)}
.brow .raw{font-size:12px;color:var(--mut);direction:ltr;text-align:right}
.brow .line{display:flex;gap:8px;align-items:center;margin-top:6px}
.brow select{flex:1;min-width:0;font-size:13px;direction:ltr;color:var(--mut);padding:10px 8px;border-radius:10px;border:1px solid var(--line);background:var(--bg)}
.brow .bq{width:64px;flex:none;text-align:center;font-weight:800;font-size:17px;padding:9px 4px}
.brow .x{flex:none}
.catb{display:inline-block;direction:ltr;font-size:12px;font-weight:800;letter-spacing:.5px;padding:2px 8px;border-radius:7px;background:#2f4a8a;color:#fff;margin:0 0 0 7px;vertical-align:1px}
@media (prefers-color-scheme:dark){.catb{background:#6f8fe0;color:#101318}}
.catbig{font-size:30px;font-weight:900;direction:ltr;text-align:right;letter-spacing:1px;color:#2f4a8a}
@media (prefers-color-scheme:dark){.catbig{color:#8fa9ee}}
.catsum{font-size:13px;color:var(--mut);margin:2px 0 10px}
.catrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.catrow:last-child{border:0}
.catrow.me{background:var(--pri2)}
.catrow .q{font-weight:800;min-width:44px;text-align:center;padding:4px 8px;border-radius:9px;background:var(--pri2);color:var(--pri)}
.catrow .q.low{background:var(--red2);color:var(--red)}
.catrow .q.zero{background:var(--red);color:#fff}
.sib{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.sib span{font-size:12px;padding:4px 9px;border-radius:8px;background:var(--bg);border:1px solid var(--line)}
.sib span.low{background:var(--red2);color:var(--red);border-color:transparent}
.sib span.zero{background:var(--red);color:#fff;border-color:transparent}
.nics{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.nics button{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:7px 11px;cursor:pointer;direction:ltr;font-size:13px}
.nics button.on{background:var(--amb2);border-color:var(--amb);color:var(--amb);font-weight:700}
.filt{display:flex;gap:6px;overflow-x:auto;margin:-2px 0 10px;padding-bottom:2px;scrollbar-width:none}
.filt:empty{display:none}
.filt .chip{direction:ltr}
.filt .chip.on{background:var(--amb2);color:var(--amb)}
.quick{display:flex;align-items:center;justify-content:center;font-size:17px;padding:17px}
.quick small{display:block;font-weight:500;font-size:12px;opacity:.85}
.or{text-align:center;color:var(--mut);font-size:12.5px;margin:18px 0 0;display:flex;align-items:center;gap:10px}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.steps{display:flex;gap:6px;margin:6px 0 4px}
.steps div{flex:1;height:5px;border-radius:5px;background:var(--line)}
.steps div.on{background:var(--pri)}
.ocrs{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.ocrs button{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer;direction:ltr;font-size:14px}
.ocrs button{position:relative}
.ocrs button[data-order]:not([data-order=''])::after{content:attr(data-order);position:absolute;top:-7px;left:-7px;background:var(--pri);color:#fff;font-size:11px;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;direction:rtl}
.ocrs button.on{background:var(--pri2);border-color:var(--pri);color:var(--pri);font-weight:700}
.found{padding:12px 14px;border-radius:12px;background:var(--pri2);color:var(--pri);margin-top:10px;line-height:1.8}
.found.new{background:var(--amb2);color:var(--amb)}
.codebox{direction:ltr;text-align:center;font-size:20px;font-weight:800;letter-spacing:1px;padding:14px;margin-top:10px}
.dlg{background:var(--card);border-radius:18px;padding:18px;width:min(92vw,380px);margin:auto;line-height:1.8}
.dlg .acts{display:flex;gap:8px;margin-top:14px}
.dlg .acts button{flex:1}
#toast{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translateX(-50%)}

.scan{flex:none;width:48px;border:1px solid var(--line);background:var(--card);border-radius:12px;display:grid;place-items:center;cursor:pointer;color:var(--pri)}
.scan svg{width:24px;height:24px}
.fld{display:flex;gap:6px}
textarea.inp{min-height:160px;direction:ltr;font-size:12px}

/* ---------- حسابداری امیر ---------- */
#dov{z-index:60!important}
#toast{z-index:70!important}
.amir{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
.amhead{position:sticky;top:0;z-index:5;background:linear-gradient(135deg,#c9b8f5,#9fd0f7);color:#2a1d52;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;display:flex;align-items:center;gap:10px}
@media (prefers-color-scheme:dark){.amhead{background:linear-gradient(135deg,#3d2f6e,#1f4a6b);color:#efeaff}}
.amhead b{flex:1;font-size:18px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amhead button{border:0;background:rgba(255,255,255,.45);color:inherit;border-radius:12px;padding:8px 12px;font-weight:700;cursor:pointer;font-size:13px}
.amhead #amBack{font-size:18px;padding:6px 12px}
#amBody{max-width:720px;margin:0 auto;padding:12px 14px}
.amnav{position:fixed;bottom:0;left:0;right:0;z-index:8;background:var(--card);border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.amnav button{flex:1;border:0;background:none;padding:6px 0;font-size:12px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.amnav button.on{color:#5b3fb0;font-weight:700}
@media (prefers-color-scheme:dark){.amnav button.on{color:#b9a2e6}}
.amnav svg{width:23px;height:23px}
.amfab{position:fixed;left:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:9;border:0;border-radius:18px;background:#d9ccff;color:#2a1d52;font-weight:800;font-size:16px;padding:16px 22px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
.amsum{background:linear-gradient(135deg,#e7defe,#d7ecfd);border-radius:20px;padding:16px;margin-bottom:12px;display:flex;align-items:center;gap:14px;color:#2a1d52}
@media (prefers-color-scheme:dark){.amsum{background:linear-gradient(135deg,#2e2550,#1b3550);color:#efeaff}}
.amsum .big{font-size:24px;font-weight:900;margin:4px 0;background:none;padding:0;color:inherit;width:auto}
.amsum small{opacity:.75;font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px 8px;margin-bottom:12px}
.tile{display:flex;flex-direction:column;align-items:center;gap:7px;border:0;background:none;cursor:pointer;font-size:12.5px;color:var(--ink);padding:4px}
.tile i{font-style:normal;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:#6b4fa0;color:#fff}
.tile:nth-child(even) i{background:#1f5f78}
.lst{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-bottom:12px}
.li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.li:last-child{border:0}
.li .ic{width:42px;height:42px;border-radius:12px;background:#6b4fa0;color:#fff;display:grid;place-items:center;font-size:19px;flex:none}
.li:nth-child(even) .ic{background:#1f5f78}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-weight:700}
.li .tx small{color:var(--mut);font-size:12px;display:block;margin-top:2px}
.li .end{text-align:left;font-weight:800;white-space:nowrap;font-size:14px}
.li .end small{display:block;font-weight:500;color:var(--mut);font-size:11.5px}
.pos{color:#1d7a4f}.neg{color:var(--red)}
.amh2{font-size:15px;font-weight:800;margin:18px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.amh2 button{border:0;background:none;color:#5b3fb0;font-weight:700;cursor:pointer;font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 0 10px;padding-bottom:2px;scrollbar-width:none}
.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:8px 14px;font-size:13px;white-space:nowrap;cursor:pointer}
.chips button.on{background:#d9ccff;border-color:transparent;color:#2a1d52;font-weight:700}
.irow{display:grid;grid-template-columns:1fr 70px 100px 34px;gap:6px;align-items:center;margin-bottom:6px}

<script>

const F = n => fa.format(+n || 0);
const fd = s => String(s).replace(/\d/g, d => '۰۱۲۳۴۵۶۷۸۹'[d]);
function num(s){
  s = String(s ?? '').replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d))
    .replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d))

const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2, '0');
const dayKey = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function g2j(gy, gm, gd){
  const gdm = [0,31,59,90,120,151,181,212,243,273,304,334];
  const gy2 = gm > 2 ? gy + 1 : gy;
  let days = 355666 + 365*gy + Math.floor((gy2+3)/4) - Math.floor((gy2+99)/100) + Math.floor((gy2+399)/400) + gd + gdm[gm-1];
  let jy = -1595 + 33*Math.floor(days/12053); days %= 12053;
  jy += 4*Math.floor(days/1461); days %= 1461;
  if (days > 365){ jy += Math.floor((days-1)/365); days = (days-1)%365; }
  const jm = days < 186 ? 1 + Math.floor(days/31) : 7 + Math.floor((days-186)/30);
  const jd = days < 186 ? 1 + days%31 : 1 + (days-186)%30;
  return [jy, jm, jd];
}

const MONTHS = ['فروردین','اردیبهشت','خرداد','تیر','مرداد','شهریور','مهر','آبان','آذر','دی','بهمن','اسفند'];
const jOf = d => g2j(d.getFullYear(), d.getMonth()+1, d.getDate());
const jOfKey = k => { const [y,m,d] = k.split('-').map(Number); return g2j(y, m, d); };
function toast(t){ const e = $('#toast'); e.textContent = t; e.classList.add('on'); clearTimeout(e._t); e._t = setTimeout(() => e.classList.remove('on'), 2200); }
function ask(msg, yes = 'بله', text = null){

    $('#dYes').onclick = () => done(true); $('#dNo').onclick = () => done(false);
    if (text != null) setTimeout(() => { ta.focus(); ta.select(); }, 50);

}

function faDigits(t){ return String(t).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)); }
// کلمه‌های رایج فارسی برای طعم‌ها و برندها ← انگلیسی
const FA_EN = {
  'آیس': 'ICE', 'ایس': 'ICE', 'یخ': 'ICE', 'یخی': 'ICE', 'انگور': 'GRAPE', 'نعناع': 'MINT', 'نعنا': 'MINT', 'مینت': 'MINT', 'هندوانه': 'WATERMELON',
  'هندونه': 'WATERMELON', 'توت‌فرنگی': 'STRAWBERRY', 'توتفرنگی': 'STRAWBERRY', 'استرابری': 'STRAWBERRY', 'انبه': 'MANGO', 'منگو': 'MANGO', 'بلوبری': 'BLUEBERRY',
  'گیلاس': 'CHERRY', 'آلبالو': 'CHERRY', 'چری': 'CHERRY', 'هلو': 'PEACH', 'پیچ': 'PEACH', 'آناناس': 'PINEAPPLE', 'پاین': 'PINEAPPLE', 'پرتقال': 'ORANGE', 'پرتغال': 'ORANGE', 'اورنج': 'ORANGE',
  'لیمو': 'LEMON', 'لیموناد': 'LEMONADE', 'سیب': 'APPLE', 'اپل': 'APPLE', 'موز': 'BANANA', 'کیوی': 'KIWI', 'تنباکو': 'TOBACCO', 'توباکو': 'TOBACCO', 'بادام': 'ALMOND',
  'آدامس': 'GUM', 'لاش': 'LUSH', 'الفاخر': 'AL FAKHER', 'فاخر': 'FAKHER', 'کراون': 'CROWN', 'مزایا': 'MAZAYA', 'آرتری': 'ARTERY', 'بلو': 'BLUE', 'آبی': 'BLUE', 'کولا': 'COLA',
  'گواوا': 'GUAVA', 'لیچی': 'LYCHEE', 'طالبی': 'MELON', 'ملون': 'MELON', 'پشن': 'PASSION', 'قهوه': 'COFFEE', 'وانیل': 'VANILLA', 'تمشک': 'RASPBERRY', 'رزبری': 'RASPBERRY',
  'بری': 'BERRY', 'انرژی': 'ENERGY', 'دابل': 'DOUBLE', 'گرین': 'GREEN', 'سبز': 'GREEN', 'پینک': 'PINK', 'صورتی': 'PINK', 'میکس': 'MIXED', 'ابری': 'CLOUD', 'کلاد': 'CLOUD', 'آئورا': 'AURA',
  'اورا': 'AURA', 'مگا': 'MEGA', 'مکس': 'MAX', 'پرو': 'PRO', 'بار': 'BAR', 'الف': 'ELF', 'السی': 'LUSH', 'فیوژن': 'FUSION', 'نارگیل': 'COCONUT', 'گلابی': 'PEAR', 'انار': 'POMEGRANATE',
  'شاتوت': 'BLACKBERRY', 'ترش': 'SOUR', 'کارامل': 'CARAMEL', 'شکلات': 'CHOCOLATE', 'خامه': 'CREAM', 'یاکولت': 'YAKULT'
};
// حروف فارسی ← حروف انگلیسی (برای کلمه‌هایی که در فهرست نیستند)
const FA_LAT = {'ا':'a','آ':'a','ب':'b','پ':'p','ت':'t','ث':'s','ج':'j','چ':'ch','ح':'h','خ':'kh','د':'d','ذ':'z','ر':'r','ز':'z','ژ':'zh','س':'s','ش':'sh','ص':'s','ض':'z','ط':'t','ظ':'z','ع':'','غ':'gh','ف':'f','ق':'gh','ک':'k','ك':'k','گ':'g','ل':'l','م':'m','ن':'n','و':'u','ه':'h','ی':'i','ي':'i','ئ':'i','ء':'','ة':'h'};
function faToEn(t){
  t = faDigits(t).replace(/‌/g, '');
  return t.split(/(\s+)/).map(w => {
    if (!/[؀-ۿ]/.test(w)) return w;
    if (FA_EN[w]) return FA_EN[w];
    return w + ' ' + [...w].map(c => FA_LAT[c] ?? c).join('');
  }).join('');
}

const S = {cloud: false};
function write(path, fn){ try { fn(); } catch(e){} }

<script>
// ==================== حسابداری امیر ====================
// بخش کاملاً جدا از انبارها: امور تجاری (فاکتور، طرف حساب، دریافت/پرداخت، گزارش‌ها)
// و امور شخصی (حساب‌ها، تراکنش‌ها، چک، وام، قرض، بودجه).
(() => {
const AMK = 'amir-v1';
const TYPES = ['settings', 'products', 'parties', 'invoices', 'pays', 'accounts', 'txns', 'checks', 'loans', 'debts', 'budgets'];
const A = {}; TYPES.forEach(t => A[t] = {});
let amBase = null, amSubbed = false;
const amCloud = () => !!(S.cloud && typeof cloudDb !== 'undefined' && cloudDb);

function amLoad(){ try { const o = JSON.parse(localStorage.getItem(AMK) || '{}'); TYPES.forEach(t => A[t] = o[t] || {}); } catch(e){} }
function amSaveLocal(){ if (amCloud()) return; try { localStorage.setItem(AMK, JSON.stringify(A)); } catch(e){ toast('حافظه‌ی گوشی پر شده'); } }
function put(t, id, o){
  A[t] = {...A[t], [id]: o};
  if (amCloud()) write('am/' + t + '/' + id, () => amBase.collection(t).doc(id).set(o)); else amSaveLocal();
  amRender();
}
function del(t, id){
  const c = {...A[t]}; delete c[id]; A[t] = c;
  if (amCloud()) write('am/' + t + '/' + id, () => amBase.collection(t).doc(id).delete()); else amSaveLocal();
  amRender();
}
function amSubscribe(){
  if (!amCloud() || amSubbed) return;
  amSubbed = true;
  amBase = cloudDb.doc('data/users/' + cloudUid + '/amir');
  TYPES.forEach(t => amBase.collection(t).onSnapshot(s => {
    const o = {}; s.docs.forEach(d => o[d.id] = d.data()); A[t] = o; amRender();
  }, () => {}));
}
window.amirExport = () => { try { return JSON.parse(localStorage.getItem(AMK) || '{}'); } catch(e){ return {}; } };
window.amirImport = o => { try { localStorage.setItem(AMK, JSON.stringify(o || {})); amLoad(); amRender(); } catch(e){} };

// ---------- تاریخ شمسی ----------
function j2g(jy, jm, jd){
  jy += 1595;
  let days = -355668 + 365 * jy + Math.floor(jy / 33) * 8 + Math.floor(((jy % 33) + 3) / 4) + jd + (jm < 7 ? (jm - 1) * 31 : ((jm - 7) * 30) + 186);
  let gy = 400 * Math.floor(days / 146097); days %= 146097;
  if (days > 36524){ gy += 100 * Math.floor(--days / 36524); days %= 36524; if (days >= 365) days++; }
  gy += 4 * Math.floor(days / 1461); days %= 1461;
  if (days > 365){ gy += Math.floor((days - 1) / 365); days = (days - 1) % 365; }
  let gd = days + 1;
  const sal = [0, 31, ((gy % 4 === 0 && gy % 100 !== 0) || gy % 400 === 0) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
  let gm; for (gm = 1; gm <= 12 && gd > sal[gm]; gm++) gd -= sal[gm];
  return [gy, gm, gd];
}
const today = () => dayKey(new Date());
const jKey = (y, m, d) => { const [a, b, c] = j2g(y, m, d); return `${a}-${pad(b)}-${pad(c)}`; };
const jStr = k => { if (!k) return ''; const [y, m, d] = jOfKey(k); return fd(`${y}/${m}/${d}`); };
const jEdit = k => { const [y, m, d] = jOfKey(k || today()); return `${y}/${m}/${d}`; };
function parseJ(str){
  const m = faDigits(String(str || '')).trim().match(/^(\d{4})\D(\d{1,2})\D(\d{1,2})$/);
  if (!m || +m[2] < 1 || +m[2] > 12 || +m[3] < 1 || +m[3] > 31) return null;
  return jKey(+m[1], +m[2], +m[3]);
}
function addJMonths(k, n){
  let [y, m, d] = jOfKey(k); m += n;
  while (m > 12){ m -= 12; y++; } while (m < 1){ m += 12; y--; }
  if (m > 6 && d > 30) d = 30; if (m === 12 && d > 29) d = 29;
  return jKey(y, m, d);
}
const addDays = (k, n) => { const [y, m, d] = k.split('-').map(Number); return dayKey(new Date(y, m - 1, d + n)); };
function presetRange(p){
  const t = today(), [jy, jm] = jOf(new Date());
  return {today: [t, t], week: [addDays(t, -6), t], month: [jKey(jy, jm, 1), t], year: [jKey(jy, 1, 1), t],
    m6: [addDays(t, -182), t], m12: [addDays(t, -365), t], all: ['0000-00-00', '9999-99-99']}[p];
}
const PRESETS = [['today', 'امروز'], ['week', 'هفته'], ['month', 'این ماه'], ['year', 'امسال'], ['m12', '۱۲ ماه گذشته'], ['all', 'همه']];

// ---------- عدد به حروف ----------
function words(n){
  n = Math.round(Math.abs(n)); if (!n) return 'صفر';
  const ones = ['', 'یک', 'دو', 'سه', 'چهار', 'پنج', 'شش', 'هفت', 'هشت', 'نه'];
  const teens = ['ده', 'یازده', 'دوازده', 'سیزده', 'چهارده', 'پانزده', 'شانزده', 'هفده', 'هجده', 'نوزده'];
  const tens = ['', '', 'بیست', 'سی', 'چهل', 'پنجاه', 'شصت', 'هفتاد', 'هشتاد', 'نود'];
  const hund = ['', 'یکصد', 'دویست', 'سیصد', 'چهارصد', 'پانصد', 'ششصد', 'هفتصد', 'هشتصد', 'نهصد'];
  const big = ['', 'هزار', 'میلیون', 'میلیارد', 'هزار میلیارد'];
  const three = x => { const p = [], h = Math.floor(x / 100), r = x % 100; if (h) p.push(hund[h]);
    if (r >= 10 && r < 20) p.push(teens[r - 10]); else { const t = Math.floor(r / 10), o = r % 10; if (t) p.push(tens[t]); if (o) p.push(ones[o]); }
    return p.join(' و '); };
  const parts = []; let i = 0;
  while (n > 0){ const c = n % 1000; if (c) parts.unshift(three(c) + (big[i] ? ' ' + big[i] : '')); n = Math.floor(n / 1000); i++; }
  return parts.join(' و ');
}

// ---------- محاسبات ----------
const ST = () => A.settings.main || {};
const invTotal = v => (v.items || []).reduce((s, i) => s + (+i.qty || 0) * (+i.price || 0), 0) - (+v.discount || 0) + (+v.extra || 0);
const invRemain = v => invTotal(v) - (+v.paid || 0);
const KIND = {sale: 'فاکتور فروش', buy: 'فاکتور خرید', stkin: 'ورود کالا', stkout: 'خروج کالا'};
const liveInv = () => Object.entries(A.invoices).filter(([, v]) => !v.pre);
function stock(pid){
  const p = A.products[pid]; if (!p) return 0;
  let q = +p.open || 0;
  liveInv().forEach(([, v]) => (v.items || []).forEach(i => { if (i.pid !== pid) return;
    if (v.kind === 'buy' || v.kind === 'stkin') q += +i.qty || 0; else q -= +i.qty || 0; }));
  return q;
}
// مانده‌ی طرف حساب: مثبت = بدهکار (او به ما بدهکار است)، منفی = بستانکار
function partyEntries(pid){
  const e = [], p = A.parties[pid];
  liveInv().forEach(([id, v]) => {
    if (v.party !== pid) return;
    const no = fd(v.no || ''), t = invTotal(v);
    if (v.kind === 'sale'){ e.push({d: v.date, title: 'فاکتور فروش ' + no, bed: t, bes: 0, inv: id}); if (+v.paid) e.push({d: v.date, title: 'دریافت (فاکتور ' + no + ')', bed: 0, bes: +v.paid}); }
    if (v.kind === 'buy'){ e.push({d: v.date, title: 'فاکتور خرید ' + no, bed: 0, bes: t, inv: id}); if (+v.paid) e.push({d: v.date, title: 'پرداخت (فاکتور ' + no + ')', bed: +v.paid, bes: 0}); }
  });
  Object.values(A.pays).forEach(x => {
    if (x.party !== pid) return;
    const how = {cash: 'نقد', card: 'کارت', check: 'چک'}[x.method] || '';
    if (x.kind === 'recv') e.push({d: x.date, title: 'دریافت ' + how, bed: 0, bes: +x.amount});
    else e.push({d: x.date, title: 'پرداخت ' + how, bed: +x.amount, bes: 0});
  });
  e.sort((a, b) => (a.d || '').localeCompare(b.d || ''));
  const open = p ? (+p.open || 0) * (p.openType === 'bes' ? -1 : 1) : 0;
  return {open, e};
}
function balance(pid){ const {open, e} = partyEntries(pid); return e.reduce((s, x) => s + x.bed - x.bes, open); }
function accBalance(aid){
  const a = A.accounts[aid]; if (!a) return 0;
  let b = +a.open || 0;
  Object.values(A.txns).forEach(t => {
    if (t.kind === 'in' && t.acc === aid) b += +t.amount;
    if (t.kind === 'out' && t.acc === aid) b -= +t.amount;
    if (t.kind === 'tr'){ if (t.acc === aid) b -= +t.amount; if (t.acc2 === aid) b += +t.amount; }
  });
  Object.values(A.pays).forEach(x => { if (x.acc === aid && x.method !== 'check') b += (x.kind === 'recv' ? 1 : -1) * (+x.amount); });
  liveInv().forEach(([, v]) => { if (v.acc === aid && +v.paid) b += (v.kind === 'sale' ? 1 : v.kind === 'buy' ? -1 : 0) * (+v.paid); });
  return b;
}
const inR = (k, r) => k >= r[0] && k <= r[1];
const sorted = (t, f = 'name') => Object.entries(A[t]).sort((a, b) => String(a[1][f] || '').localeCompare(String(b[1][f] || ''), 'fa'));
const byDate = t => Object.entries(A[t]).sort((a, b) => (b[1].date || '').localeCompare(a[1].date || '') || (b[1].t || '').localeCompare(a[1].t || ''));
const pname = id => A.parties[id]?.name || '—';
const aname = id => A.accounts[id]?.name || '—';
const balTxt = b => b > 0 ? `<span class="neg">${F(b)}</span><small>بدهکار</small>` : b < 0 ? `<span class="pos">${F(-b)}</span><small>بستانکار</small>` : `<span>۰</span><small>تسویه</small>`;
const EXP_CATS = ['خوراک', 'حمل‌ونقل', 'قبوض', 'اجاره', 'خرید', 'سلامت', 'تفریح', 'آموزش', 'هدیه', 'سایر'];
const INC_CATS = ['حقوق', 'فروش', 'سود', 'هدیه', 'سایر'];
const COLORS = ['#6b4fa0', '#1f5f78', '#d98c2b', '#c0392b', '#2f8f5b', '#8e44ad', '#2980b9', '#b7950b', '#7f8c8d', '#e67e22'];

// ---------- لایه و مسیریابی ----------
document.body.insertAdjacentHTML('beforeend', `

const body = $('#amBody');
let stack = [{p: 'home'}];
const TITLES = {home: 'حسابداری امیر', biz: 'امور تجاری', pers: 'امور شخصی', reports: 'گزارش‌ها', products: 'کالا / خدمات', parties: 'طرف‌حساب‌ها',
  party: 'طرف‌حساب', invoices: 'فاکتورها', inv: 'فاکتور', invEdit: 'فاکتور', pays: 'دریافت / پرداخت', stock: 'ورود / خروج کالا', ledger: 'گزارش معین',
  invSearch: 'جستجوی فاکتورها', prodRep: 'خرید و فروش کالا', profit: 'سود دوره‌ای', debtors: 'بدهکاران / بستانکاران', txns: 'تراکنش‌ها', checks: 'چک‌ها',
  loans: 'وام و اقساط', loan: 'وام', debts: 'قرض‌ها', budgets: 'بودجه‌بندی', chart: 'نمودار مخارج', accounts: 'حساب‌ها', calendar: 'تقویم کاری'};
function amOpen(){ amLoad(); amSubscribe(); $('#amir').hidden = false; document.body.style.overflow = 'hidden'; try { localStorage.setItem('anbar-amir', '1'); } catch(e){} amRender(); }
function amClose(){ $('#amir').hidden = true; document.body.style.overflow = ''; try { localStorage.setItem('anbar-amir', ''); } catch(e){} }
window.amOpen = amOpen;
function amGo(p, params = {}, root = false){ if (root) stack = [{p, ...params}]; else stack.push({p, ...params}); $('#amir').scrollTop = 0; amRender(); }
function amBackFn(){ if (stack.length > 1){ stack.pop(); amRender(); return true; } if (stack[0].p !== 'home'){ stack = [{p: 'home'}]; amRender(); return true; } return false; }
$('#amBack').onclick = () => { if (!amBackFn() && !window.AMIR_STANDALONE) amClose(); };
$('#amExit').onclick = amClose;
$('#amNav').onclick = e => { const b = e.target.closest('[data-root]'); if (b) amGo(b.dataset.root, {}, true); };
$('#amNew').onclick = () => openSheet('newDoc');
// دکمه‌ی برگشت گوشی
const _back = window.onBack;
window.onBack = () => {
  if (!$('#amir').hidden){
    if ($('#dov').classList.contains('on')) return _back();
    if ($('#amSheet').classList.contains('on')){ closeSheet(); return true; }
    if (!amBackFn()){ if (window.AMIR_STANDALONE) return false; amClose(); }
    return true;
  }
  return _back ? _back() : false;
};

function amRender(){
  if ($('#amir').hidden) return;
  const cur = stack[stack.length - 1];
  const root = stack[0].p;
  $('#amNav').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.root === root));
  $('#amTitle').textContent = cur.p === 'party' ? pname(cur.id) : cur.p === 'invoices' ? (cur.kind === 'buy' ? 'فاکتورهای خرید' : 'فاکتورهای فروش') : (TITLES[cur.p] || 'حسابداری امیر');
  $('#amBack').style.visibility = stack.length > 1 || root !== 'home' ? 'visible' : 'hidden';
  body.innerHTML = (PAGES[cur.p] || PAGES.home)(cur);
}

// ---------- قطعه‌های مشترک ----------
const tile = (ic, label, act) => `<button class="tile" data-act="${act}"><i>${ic}</i>${label}</button>`;
const li = (ic, title, sub, end, act) => `<div class="li" data-act="${act}"><div class="ic">${ic}</div><div class="tx"><b>${title}</b>${sub ? `<small>${sub}</small>` : ''}</div>${end ? `<div class="end">${end}</div>` : ''}</div>`;
const empty = (t, s) => `<div class="empty"><b>${t}</b>${s || ''}</div>`;
const rangeChips = (cur) => `<div class="chips">${PRESETS.map(([k, l]) => `<button data-act="range:${k}" class="${cur === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
const curRange = c => presetRange(c.range || 'month');
function donut(items, size = 120){
  const tot = items.reduce((s, x) => s + x.v, 0) || 1, r = 15.9;
  let off = 25;
  const segs = items.map((x, i) => { const p = x.v / tot * 100; const s = `<circle cx="20" cy="20" r="${r}" fill="none" stroke="${x.c || COLORS[i % COLORS.length]}" stroke-width="6" stroke-dasharray="${p} ${100 - p}" stroke-dashoffset="${off}"/>`; off -= p; return s; }).join('');
  return `<svg class="donut" width="${size}" height="${size}" viewBox="0 0 40 40"><circle cx="20" cy="20" r="${r}" fill="none" stroke="rgba(127,127,127,.18)" stroke-width="6"/>${segs}</svg>`;
}
function monthExpenses(){
  const [jy, jm] = jOf(new Date()), r = [jKey(jy, jm, 1), today()];
  const by = {}; let inc = 0, exp = 0;
  Object.values(A.txns).forEach(t => { if (!inR(t.date, r)) return; if (t.kind === 'out'){ exp += +t.amount; by[t.cat || 'سایر'] = (by[t.cat || 'سایر'] || 0) + (+t.amount); } if (t.kind === 'in') inc += +t.amount; });
  return {by, inc, exp};
}
function reminders(days = 10){
  const t = today(), lim = addDays(t, days), out = [];
  Object.entries(A.checks).forEach(([id, c]) => { if (c.status === 'pending' && c.due && c.due <= lim) out.push({d: c.due, txt: `چک ${c.kind === 'recv' ? 'دریافتی' : 'پرداختی'} ${c.person || ''} — ${F(c.amount)} ریال`, act: 'go:checks'}); });
  Object.entries(A.loans).forEach(([id, l]) => { for (let i = 0; i < (+l.count || 0); i++){ if ((l.paid || []).includes(i)) continue; const d = addJMonths(l.first, i); if (d <= lim) out.push({d, txt: `قسط ${fd(i + 1)} وام ${l.title} — ${F(l.inst)} ریال`, act: 'loan:' + id}); break; } });
  Object.entries(A.debts).forEach(([id, x]) => { if (!x.settled && x.due && x.due <= lim) out.push({d: x.due, txt: `${x.kind === 'lent' ? 'طلب از' : 'بدهی به'} ${x.person} — ${F(x.amount)} ریال`, act: 'go:debts'}); });
  return out.sort((a, b) => a.d.localeCompare(b.d));
}

    ${tile('🔷', 'کالا / خدمات', 'go:products')}${tile('🛒', 'ورود / خروج کالا', 'go:stock')}${tile('💵', 'دریافت / پرداخت', 'go:pays')}</div>

},

},
parties(){

},
party(c){
  const p = A.parties[c.id]; if (!p) return empty('پیدا نشد');
  const b = balance(c.id);
  const invs = byDate('invoices').filter(([, v]) => v.party === c.id);
  return `<div class="amsum"><div style="width:54px;height:54px;border-radius:50%;background:#6b4fa0;color:#fff;display:grid;place-items:center;font-size:24px;flex:none">👤</div>

  const sum = list.filter(([, v]) => !v.pre).reduce((s, [, v]) => s + invRemain(v), 0);
  return `<input class="inp" placeholder="جستجوی نام یا شماره…" value="${esc(c.q || '')}" data-search="q" style="margin-bottom:10px">

  out += window.Android ? '<div class="amprintbar"><button class="big" data-act="print">🖨 چاپ / PDF</button></div>' : '';

let draft = null;
function newInvoice(kind, party = ''){
  const nos = Object.values(A.invoices).filter(v => v.kind === kind).map(v => +v.no || 0);
  draft = {id: null, v: {kind, no: (nos.length ? Math.max(...nos) : 0) + 1, date: today(), party, items: [], discount: 0, extra: 0, paid: 0, acc: Object.keys(A.accounts)[0] || '', note: '', pre: false}};
  draft.v.items.push({pid: '', name: '', qty: 1, price: 0, cost: 0, unit: 'عدد'});
  amGo('invEdit');
}
function editInvoice(id){ draft = {id, v: JSON.parse(JSON.stringify(A.invoices[id]))}; if (!draft.v.items.length) draft.v.items.push({pid: '', name: '', qty: 1, price: 0, unit: 'عدد'}); amGo('invEdit'); }
function invEditor(){
  if (!draft) return empty('فاکتوری باز نیست');
  const v = draft.v, money = v.kind === 'sale' || v.kind === 'buy';
  const prods = sorted('products');
  const pOpts = sel => `<option value="">— کالا —</option>${prods.map(([id, p]) => `<option value="${id}" ${id === sel ? 'selected' : ''}>${esc(p.name)}${p.type === 'srv' ? '' : ' (' + F(stock(id)) + ')'}</option>`).join('')}`;
  return `<div class="row"><div><span class="lbl">شماره</span><input class="inp" data-f="no" value="${fd(v.no)}" inputmode="numeric"></div>
    <div><span class="lbl">تاریخ (شمسی)</span><input class="inp" data-f="date" value="${jEdit(v.date)}" style="direction:ltr;text-align:center" placeholder="1405/9/6"></div></div>
  ${money ? `<span class="lbl">${v.kind === 'sale' ? 'خریدار' : 'فروشنده'}</span><div class="fld"><select class="inp" data-f="party"><option value="">— طرف‌حساب —</option>${sorted('parties').map(([id, p]) => `<option value="${id}" ${id === v.party ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select>
    <button class="btn2" style="width:auto;margin:0;padding:0 14px" data-act="sheet:party:new:inv">+</button></div>` : ''}
  <div class="amh2">اقلام <button data-act="sheet:product:new:inv">+ تعریف کالای جدید</button></div>
  ${v.items.map((i, n) => `<div class="irow" data-row="${n}"><select class="inp" data-i="pid">${pOpts(i.pid)}</select><input class="inp" data-i="qty" value="${F(i.qty)}" inputmode="decimal" placeholder="تعداد">
    ${money ? `<input class="inp money" data-i="price" value="${i.price ? F(i.price) : ''}" inputmode="numeric" placeholder="فی">` : '<span></span>'}<button class="x" data-act="rmrow:${n}">✕</button>
    ${money ? `<div class="lt" data-lt="${n}">${ltText(i)}</div>` : ''}</div>`).join('')}
  <button class="btn2" data-act="addrow">+ افزودن ردیف</button>
  ${money ? `<div class="row"><div><span class="lbl">تخفیف</span><input class="inp money" data-f="discount" value="${v.discount ? F(v.discount) : ''}" inputmode="numeric"></div>
    <div><span class="lbl">کرایه / هزینه‌ی اضافه</span><input class="inp money" data-f="extra" value="${v.extra ? F(v.extra) : ''}" inputmode="numeric"></div></div>
  <div class="row"><div><span class="lbl">${v.kind === 'sale' ? 'دریافتی همین الان' : 'پرداختی همین الان'}</span><input class="inp money" data-f="paid" value="${v.paid ? F(v.paid) : ''}" inputmode="numeric"></div>
    <div><span class="lbl">به / از حساب</span><select class="inp" data-f="acc"><option value="">—</option>${sorted('accounts').map(([id, a]) => `<option value="${id}" ${id === v.acc ? 'selected' : ''}>${esc(a.name)}</option>`).join('')}</select></div></div>
  <div class="tot" id="amTot">${totHTML(v)}</div>
  <label style="display:flex;gap:8px;align-items:center;margin:12px 4px 0;font-size:14px"><input type="checkbox" data-f="pre" ${v.pre ? 'checked' : ''}> پیش‌فاکتور (روی موجودی و حساب‌ها اثر ندارد)</label>` : ''}
  <span class="lbl">توضیحات</span><input class="inp" data-f="note" value="${esc(v.note || '')}">
  <button class="big ${v.kind === 'sale' || v.kind === 'stkout' ? 'out' : ''}" data-act="saveinv">ذخیره ${KIND[v.kind]}</button>`;
}
function ltText(i){ return i.pid ? `${F((+i.qty || 0) * (+i.price || 0))} ریال${A.products[i.pid] && A.products[i.pid].type !== 'srv' ? ' · موجودی: ' + F(stock(i.pid)) : ''}` : ''; }
function totHTML(v){
  return `<div><span>جمع اقلام</span><b>${F(v.items.reduce((s, i) => s + (+i.qty || 0) * (+i.price || 0), 0))}</b></div>${+v.discount ? `<div><span>تخفیف</span><b>−${F(v.discount)}</b></div>` : ''}${+v.extra ? `<div><span>کرایه</span><b>+${F(v.extra)}</b></div>` : ''}
    <div><span>${v.kind === 'sale' ? 'دریافتی' : 'پرداختی'}</span><b>${F(v.paid)}</b></div><div><span>جمع کل</span><span>${F(invTotal(v))}</span></div><div><span>مانده</span><span>${F(invRemain(v))} ریال</span></div>`;
}
function liveTotals(){
  if (!draft || !$('#amTot')) return;
  readDraft();
  $('#amTot').innerHTML = totHTML(draft.v);
  draft.v.items.forEach((i, n) => { const e = body.querySelector(`[data-lt="${n}"]`); if (e) e.textContent = ltText(i); });
}
function readDraft(){
  if (!draft) return;
  const v = draft.v;
  body.querySelectorAll('[data-f]').forEach(e => {
    const f = e.dataset.f;
    if (f === 'pre') v.pre = e.checked;
    else if (['discount', 'extra', 'paid', 'no'].includes(f)) v[f] = num(e.value);
    else if (f === 'date'){ const d = parseJ(e.value); if (d) v.date = d; }
    else v[f] = e.value;
  });
  body.querySelectorAll('[data-row]').forEach(r => {
    const i = v.items[+r.dataset.row]; if (!i) return;
    const pid = r.querySelector('[data-i=pid]').value;
    i.qty = num(r.querySelector('[data-i=qty]').value);
    if (pid !== i.pid){ i.pid = pid; const p = A.products[pid]; if (p){ i.name = p.name; i.unit = p.unit || 'عدد'; i.price = v.kind === 'buy' ? (+p.buy || 0) : (+p.sell || 0); } }
    else { const pr = r.querySelector('[data-i=price]'); if (pr) i.price = num(pr.value); }
  });
}
function saveDraft(){
  readDraft();
  const v = draft.v;
  v.items = v.items.filter(i => i.pid && (+i.qty || 0) > 0);
  if (!v.items.length){ toast('حداقل یک کالا با تعداد وارد کنید'); v.items.push({pid: '', name: '', qty: 1, price: 0, unit: 'عدد'}); amRender(); return; }
  const dateEl = body.querySelector('[data-f=date]');
  if (dateEl && !parseJ(dateEl.value)){ toast('تاریخ درست نیست؛ مثل 1405/9/6 بنویسید'); return; }
  if ((v.kind === 'sale' || v.kind === 'buy') && !v.party){ toast('طرف‌حساب را انتخاب کنید'); return; }
  v.items.forEach(i => { const p = A.products[i.pid]; if (p){ i.name = p.name; if (v.kind === 'sale') i.cost = +p.buy || 0; } });
  if (v.kind === 'buy') v.items.forEach(i => { const p = A.products[i.pid]; if (p && i.price && i.price !== +p.buy) put('products', i.pid, {...p, buy: i.price}); });
  const id = draft.id || newId();
  v.t = v.t || new Date().toISOString();
  put('invoices', id, v);
  draft = null; stack.pop();
  if (v.kind === 'sale' || v.kind === 'buy') amGo('inv', {id}); else amRender();
  toast(`✓ ${KIND[v.kind]} ذخیره شد`);
}

}
};
// نمایش/پنهان کردن بخش‌های وابسته در فرم‌ها
function syncShow(){
  const m = sheetBody.querySelector('[name=method]'), st = sheetBody.querySelector('[name=status]');
  sheetBody.querySelectorAll('[data-show]').forEach(e => {
    const s = e.dataset.show;
    e.hidden = s === 'check' ? !(m && m.value === 'check') : s === 'nocheck' ? (m && m.value === 'check') : s === 'cleared' ? !(st && st.value === 'cleared') : false;
  });
}
sheetBody.addEventListener('change', syncShow);
new MutationObserver(syncShow).observe(sheetBody, {childList: true});

const reqDate = (n, need) => { const v = fval(n); if (!v) return need ? null : ''; return parseJ(v); };
async function saveForm(type, id){
  const nid = id || newId();
  if (type === 'settings'){
    const s = {...ST(), biz: fval('biz'), quote: fval('quote'), address: fval('address'), phone: fval('phone')};
    const f = sheetBody.querySelector('[name=signfile]').files[0];
    if (f){ try { s.sign = await shrinkImg(f, 400); } catch(e){ toast('عکس امضا خوانده نشد'); } }
    put('settings', 'main', s); closeSheet(); toast('✓ ذخیره شد'); return;
  }
  if (type === 'product'){
    if (!fval('name')) return toast('نام را وارد کنید');
    put('products', nid, {...(A.products[id] || {}), name: fval('name'), type: fval('type'), buy: num(fval('buy')), sell: num(fval('sell')), open: num(fval('open')), unit: fval('unit') || 'عدد'});
    closeSheet();
    if (sheetCtx.fromInv && draft){ const e = draft.v.items.find(i => !i.pid); if (e){ e.pid = nid; const p = A.products[nid]; e.name = p.name; e.price = draft.v.kind === 'buy' ? p.buy : p.sell; } else draft.v.items.push({pid: nid, name: fval('name'), qty: 1, price: draft.v.kind === 'buy' ? num(fval('buy')) : num(fval('sell')), unit: fval('unit') || 'عدد'}); amRender(); }
    return toast('✓ کالا ذخیره شد');
  }
  if (type === 'party'){
    if (!fval('name')) return toast('نام را وارد کنید');
    put('parties', nid, {...(A.parties[id] || {}), name: fval('name'), phone: fval('phone'), address: fval('address'), open: num(fval('open')), openType: fval('openType'), note: fval('note')});
    closeSheet(); if (sheetCtx.fromInv && draft){ draft.v.party = nid; amRender(); } return toast('✓ ذخیره شد');
  }
  if (type === 'pay'){
    const amount = num(fval('amount')), date = reqDate('date') || today();
    if (!amount) return toast('مبلغ را وارد کنید');
    if (fval('date') && !reqDate('date')) return toast('تاریخ درست نیست؛ مثل 1405/9/6');
    const x = {...(A.pays[id] || {}), kind: fval('kind'), party: fval('party'), amount, method: fval('method'), acc: fval('acc'), date, note: fval('note'), t: (A.pays[id] || {}).t || new Date().toISOString()};
    if (x.method === 'check'){
      const due = reqDate('cdue', true); if (!due) return toast('تاریخ سررسید چک را درست وارد کنید');
      const cid = x.check || newId();
      put('checks', cid, {...(A.checks[cid] || {status: 'pending'}), kind: x.kind === 'recv' ? 'recv' : 'issued', person: pname(x.party), amount, number: fval('cnum'), bank: fval('cbank'), due, pay: nid});
      x.check = cid;
    } else if (x.check){ del('checks', x.check); delete x.check; }
    put('pays', nid, x); closeSheet(); return toast('✓ ثبت شد');
  }
  if (type === 'txn'){
    const amount = num(fval('amount')); if (!amount) return toast('مبلغ را وارد کنید');
    if (!fval('acc')) return toast(Object.keys(A.accounts).length ? 'حساب را انتخاب کنید' : 'اول از «حساب‌ها» یک حساب بسازید');
    if (fval('kind') === 'tr' && (!fval('acc2') || fval('acc2') === fval('acc'))) return toast('حساب مقصد را انتخاب کنید');
    if (fval('date') && !reqDate('date')) return toast('تاریخ درست نیست؛ مثل 1405/9/6');
    put('txns', nid, {...(A.txns[id] || {}), kind: fval('kind'), amount, acc: fval('acc'), acc2: fval('acc2'), cat: fval('cat'), date: reqDate('date') || today(), note: fval('note'), t: (A.txns[id] || {}).t || new Date().toISOString()});
    closeSheet(); return toast('✓ ثبت شد');
  }
  if (type === 'account'){
    if (!fval('name')) return toast('نام حساب را وارد کنید');
    put('accounts', nid, {...(A.accounts[id] || {}), name: fval('name'), type: fval('type'), open: num(fval('open'))}); closeSheet(); return toast('✓ ذخیره شد');
  }
  if (type === 'check'){
    const amount = num(fval('amount')), due = reqDate('due', true);
    if (!amount) return toast('مبلغ را وارد کنید'); if (!due) return toast('تاریخ سررسید را درست وارد کنید (مثل 1405/9/6)');
    const old = A.checks[id] || {}, status = fval('status');
    const c = {...old, kind: fval('kind'), person: fval('person'), amount, number: fval('number'), bank: fval('bank'), due, status, acc: fval('acc'), note: fval('note')};
    // وقتی چکِ بدون پرداختِ ثبت‌شده وصول می‌شود، در موجودی حساب هم ثبت می‌شود
    if (status === 'cleared' && c.acc && !c.txn && !c.pay){ const tid = newId(); put('txns', tid, {kind: c.kind === 'recv' ? 'in' : 'out', amount, acc: c.acc, cat: 'سایر', date: today(), note: 'چک ' + (c.person || ''), t: new Date().toISOString()}); c.txn = tid; }
    if (status === 'cleared' && c.acc && c.pay && !c.txn){ const tid = newId(); put('txns', tid, {kind: c.kind === 'recv' ? 'in' : 'out', amount, acc: c.acc, cat: 'سایر', date: today(), note: 'وصول چک ' + (c.person || ''), t: new Date().toISOString()}); c.txn = tid; }
    put('checks', nid, c); closeSheet(); return toast('✓ ذخیره شد');
  }
  if (type === 'loan'){
    const count = num(fval('count')), inst = num(fval('inst')), first = reqDate('first', true);
    if (!fval('title') || !count || !inst) return toast('عنوان، تعداد اقساط و مبلغ قسط را وارد کنید'); if (!first) return toast('تاریخ اولین قسط را درست وارد کنید');
    put('loans', nid, {...(A.loans[id] || {paid: []}), title: fval('title'), lender: fval('lender'), amount: num(fval('amount')), count, inst, first}); closeSheet(); return toast('✓ ذخیره شد');
  }
  if (type === 'debt'){
    const amount = num(fval('amount')); if (!fval('person') || !amount) return toast('نام و مبلغ را وارد کنید');
    put('debts', nid, {...(A.debts[id] || {}), kind: fval('kind'), person: fval('person'), amount, date: reqDate('date') || today(), due: reqDate('due') || '', note: fval('note'), settled: fval('settled')}); closeSheet(); return toast('✓ ذخیره شد');
  }
  if (type === 'budget'){
    const amount = num(fval('amount')); if (!amount) return toast('مبلغ را وارد کنید');
    put('budgets', nid, {cat: fval('cat'), amount}); closeSheet(); return toast('✓ ذخیره شد');
  }
}
function shrinkImg(file, max){
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => { const im = new Image(); im.onload = () => {
    const k = Math.min(1, max / Math.max(im.width, im.height)), c = document.createElement('canvas'); c.width = im.width * k; c.height = im.height * k;
    const x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); x.drawImage(im, 0, 0, c.width, c.height); res(c.toDataURL('image/jpeg', .85)); }; im.onerror = rej; im.src = r.result; }; r.onerror = rej; r.readAsDataURL(file); });
}

// ---------- کلیک‌ها ----------
async function act(a){
  const [k, ...p] = a.split(':');
  if (k === 'x'){ closeSheet(); return act(p.join(':')); }
  if (k === 'go') return amGo(p[0]);
  if (k === 'root') return amGo(p[0], {}, true);
  if (k === 'invs') return amGo('invoices', {kind: p[0]});
  if (k === 'party') return amGo('party', {id: p[0]});
  if (k === 'loan') return amGo('loan', {id: p[0]});
  if (k === 'inv') return amGo('inv', {id: p[0]});
  if (k === 'ledger') return amGo('ledger', {pid: p[0], range: 'year'});
  if (k === 'new') return newInvoice(p[0], p[1] || '');
  if (k === 'editinv') return editInvoice(p[0]);
  if (k === 'delinv'){ if (await ask('این فاکتور حذف شود؟', 'حذف')){ del('invoices', p[0]); stack.pop(); amRender(); toast('حذف شد'); } return; }
  if (k === 'tab' || k === 'range' || k === 'kind'){ stack.at(-1)[k] = p[0]; return amRender(); }
  if (k === 'print'){ if (window.Android && Android.print) Android.print(ST().biz || 'فاکتور'); else toast('برای چاپ، نسخه‌ی جدید برنامه را نصب کنید'); return; }
  if (k === 'addrow'){ readDraft(); draft.v.items.push({pid: '', name: '', qty: 1, price: 0, unit: 'عدد'}); return amRender(); }
  if (k === 'rmrow'){ readDraft(); draft.v.items.splice(+p[0], 1); if (!draft.v.items.length) draft.v.items.push({pid: '', name: '', qty: 1, price: 0, unit: 'عدد'}); return amRender(); }
  if (k === 'saveinv') return saveDraft();
  if (k === 'close') return closeSheet();
  if (k === 'backup'){ amSaveLocal(); Android.share(JSON.stringify({app: 'amir', v: 1, amir: window.amirExport()}), `amir-backup-${today()}.json`); return; }
  if (k === 'restore'){ Android.pickFile(); return; }
  if (k === 'sheet'){
    const kind = p[0];
    if (p[1] === 'new'){ readDraft(); openSheet(kind, '', ...p.slice(2)); if (p[2] === 'inv') sheetCtx.fromInv = true; return; }
    return openSheet(kind, ...p.slice(1));
  }
  if (k === 'save') return saveForm(p[0], p[1] || '');
  if (k === 'del'){
    const [t, id] = p;
    if (t === 'products' && liveInv().some(([, v]) => (v.items || []).some(i => i.pid === id))) return toast('این کالا در فاکتورها استفاده شده و حذف نمی‌شود');
    if (t === 'parties' && (Object.values(A.invoices).some(v => v.party === id) || Object.values(A.pays).some(x => x.party === id))) return toast('این طرف‌حساب فاکتور یا دریافت/پرداخت دارد و حذف نمی‌شود');
    if (t === 'accounts' && (Object.values(A.txns).some(x => x.acc === id || x.acc2 === id))) return toast('این حساب تراکنش دارد و حذف نمی‌شود');
    if (!(await ask('حذف شود؟', 'حذف'))) return;
    if (t === 'pays' && A.pays[id]?.check) del('checks', A.pays[id].check);
    del(t, id); closeSheet(); if (t === 'parties' || t === 'loans') { stack.pop(); amRender(); } toast('حذف شد');
  }
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || !e.target.closest('#amir, #amSheet')) return;
  if (!el.dataset.act) return;
  e.preventDefault(); act(el.dataset.act);
});
body.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel){ stack.at(-1)[t.dataset.sel] = t.value; return amRender(); }
  if (t.dataset.chk){ stack.at(-1)[t.dataset.chk] = !t.checked; return amRender(); }
  if (t.dataset.inst){ const [id, i] = t.dataset.inst.split(':'), l = A.loans[id], paid = new Set(l.paid || []); t.checked ? paid.add(+i) : paid.delete(+i); put('loans', id, {...l, paid: [...paid]}); return; }
  if (draft && (t.dataset.i === 'pid' || t.dataset.f === 'party' || t.dataset.f === 'pre')){ readDraft(); amRender(); }
});
let searchT;
body.addEventListener('input', e => {
  const t = e.target;
  if (draft && (t.dataset.i || ['discount', 'extra', 'paid'].includes(t.dataset.f))) setTimeout(liveTotals, 0);
  if (t.dataset.search){ stack.at(-1)[t.dataset.search] = t.value; clearTimeout(searchT); searchT = setTimeout(() => { const pos = t.selectionStart; amRender(); const n = body.querySelector('[data-search]'); if (n){ n.focus(); try { n.setSelectionRange(pos, pos); } catch(e){} } }, 250); }
});

// ---------- بازگردانی پشتیبان (برنامه‌ی جدا) ----------
window.onNativeFile = async txt => {
  let o; try { o = JSON.parse(txt); } catch(e){}
  const data = o && (o.app === 'amir' ? o.amir : o.amir || null);
  if (!data){ toast('این فایل پشتیبان حسابداری امیر نیست'); return; }
  if (!(await ask(`پشتیبان پیدا شد: ${F(Object.keys(data.invoices || {}).length)} فاکتور، ${F(Object.keys(data.parties || {}).length)} طرف‌حساب.<br>اطلاعات فعلی با آن جایگزین شود؟`, 'جایگزین کن'))) return;
  window.amirImport(data); closeSheet(); toast('بازگردانی شد ✓');
};

amLoad();
if (window.AMIR_STANDALONE){ $('#amExit').hidden = true; amOpen(); }
else { try { if (localStorage.getItem('anbar-amir') === '1') setTimeout(amOpen, 50); } catch(e){} }
})();
