name: ساخت APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Persian OCR data
        run: |
          mkdir -p app/src/main/assets/tessdata
          curl -fsSL -o app/src/main/assets/tessdata/fas.traineddata https://github.com/tesseract-ocr/tessdata_best/raw/main/fas.traineddata
          ls -la app/src/main/assets/tessdata

      - name: Build
        run: gradle :app:assembleRelease :amir:assembleRelease --no-daemon --stacktrace

      - name: Rename
        run: |
          cp app/build/outputs/apk/release/app-release.apk anbar.apk
          cp amir/build/outputs/apk/release/amir-release.apk amir.apk

      - uses: actions/upload-artifact@v4
        with:
          name: anbar-apk
          path: |
            anbar.apk
            amir.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: نسخه ${{ github.run_number }}
          files: |
            anbar.apk
            amir.apk
          make_latest: true
