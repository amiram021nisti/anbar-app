plugins {
    id 'com.android.application'
}

android {
    namespace 'ir.anbar.app'
    compileSdk 34

    defaultConfig {
        applicationId 'ir.anbar.app'
        minSdk 26
        targetSdk 34
        versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger())
        versionName "1.0." + (System.getenv('GITHUB_RUN_NUMBER') ?: '1')
    }

    // کلید ثابت، تا نسخه‌های بعدی روی نسخه‌ی قبلی نصب شوند و اطلاعات پاک نشود
    signingConfigs {
        shop {
            storeFile file('anbar.keystore')
            storePassword 'anbar123'
            keyAlias 'anbar'
            keyPassword 'anbar123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.shop
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.shop
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
    implementation 'cz.adaptech.tesseract4android:tesseract4android:4.7.0'
}
